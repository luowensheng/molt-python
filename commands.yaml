name: "molt"
commands:
    build:
        args:
            os:
                type: string
            arch:
                type: string
            version:
                type: string
            output:
                type: string
        script: |-
            set -e

            VERSION="{{.version}}"
            DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            COMMIT=$(git rev-parse --short HEAD)

            # ensure clean working tree (optional but recommended)
            git diff --quiet || {
            echo "Working tree not clean"
            exit 1
            }

            # tag existing commit (safe, no new commits)
            git tag -a "$VERSION" -m "release $VERSION" || true

            # build binary
            GOOS="{{.os}}" GOARCH="{{.arch}}" go build \
            -ldflags "\
            -X main.commit=$COMMIT \
            -X main.version=$VERSION \
            -X main.date=$DATE \
            -s -w" \
            -o "{{.output}}"

    build_mac:
        args:
            version:
                type: string
        script: |-
            set -e
            OUTPUT_DIR="./builds/{{.version}}/mac/molt"
            {{Run}} build --os darwin --arch arm64 --version {{.version}} --output $OUTPUT_DIR
            bman add $OUTPUT_DIR
            molt version
    
    build_linux_amd:
        args:
            version:
                type: string
        script: |-
            set -e
            OUTPUT_DIR="./builds/{{.version}}/linux-amd/molt"
            {{Run}} build --os linux --arch amd64 --version {{.version}} --output $OUTPUT_DIR
    
    build_all:
        args:
            version:
                index: 0
                type: string    
        script: |-
            set -e
            {{Run}} build_mac --version {{.version}}
            {{Run}} build_linux_amd --version {{.version}}

    codebase:
        script: |-
            functool merge --ignore "builds*" --ignore "testdata*" "*.go" molt.txt "// {filepath}" 


    testbuild:
        script: |-
            TEST_NAME="moltd"
            go build -o /tmp/$TEST_NAME && bman add /tmp/$TEST_NAME && rm /tmp/$TEST_NAME