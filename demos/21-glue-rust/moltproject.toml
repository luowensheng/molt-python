[project]
name = "demo-21-glue-rust"
lang = "python"

# ── Transport Glue: Rust functions via unix_socket ────────────────────────────
#
# compress_glue.rs is a thin adapter file — NOT a full Rust crate.
# molt uses `include!("compress_glue.rs")` in the generated main.rs to pull
# the user's functions into the generated server.
#
# Transport = unix_socket: the server runs as a persistent daemon so multiple
# Python threads can share one server process concurrently.

[[tool.molt.glue]]
module    = "compress"
lang      = "rust"
src       = "compress_glue.rs"      # thin adapter file (NOT a full Cargo project)
crates    = ["flate2 = '1.0'"]      # added to the generated Cargo.toml
transport = "unix_socket"           # persistent daemon; concurrent callers

  [[tool.molt.glue.fn]]
  name    = "deflate"
  args    = [{ name = "data", type = "bytes" }]
  returns = "bytes"

  [[tool.molt.glue.fn]]
  name    = "inflate"
  args    = [{ name = "data", type = "bytes" }]
  returns = "bytes"

  [[tool.molt.glue.fn]]
  name    = "ratio"
  args    = [{ name = "data", type = "bytes" }]
  returns = "f64"

[tool.molt.tasks]
demo = "python main.py"
