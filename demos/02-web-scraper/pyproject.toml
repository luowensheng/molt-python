[project]
name = "02-web-scraper"
version = "0.1.0"
description = "Web scraper demo: molt add (requests, rich) — packages hit global store cache"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.33.1",
    "rich>=15.0.0",
]

[tool.molt.tasks]
posts  = "python scraper.py posts 5"
users  = "python scraper.py users"
top10  = "python scraper.py posts 10"
